<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#16231d">
  <meta name="description" content="日本庭園の鹿威しを絶妙なタイミングで鳴らすワンタップゲーム">
  <title>鹿威しカコーン｜Japan Garden KAKOON!</title>
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
  </script>
</head>
<body>
  <div id="app">
    <canvas id="garden" aria-label="日本庭園の鹿威し"></canvas>
    <div id="fx"></div>

    <!-- ゲーム画面のHUD -->
    <div id="hud" hidden>
      <div class="hud-left"><span class="label">SCORE</span><span id="score">0</span></div>
      <div class="hud-center">
        <span id="combo-wrap"><span id="combo">0</span><span class="label"> COMBO</span></span>
        <span id="lives" aria-label="残り"></span>
      </div>
      <div class="hud-right"><span class="label">BEST</span><span id="hud-best">0</span><span id="level" class="level"></span></div>
    </div>
    <div id="judge" class="judge"></div>
    <div id="mult" class="mult"></div>
    <div id="bottom" hidden>
      <div id="tap-hint" class="tap-hint">TAP!</div>
      <div class="gauge"><div id="gauge-fill"></div><span class="gauge-label">水位</span></div>
    </div>

    <!-- 読み込み中 -->
    <section id="loading-screen" class="screen active">
      <p class="kicker">Japan Garden KAKOON!</p>
      <p class="loading-title">鹿威しカコーン</p>
      <div class="progress"><div id="progress-bar"></div></div>
      <p id="loading-text" class="loading-text">庭園を準備しています…</p>
    </section>

    <!-- タイトル画面 -->
    <section id="title-screen" class="screen">
      <div class="title-block">
        <p class="kicker">Japan Garden KAKOON!</p>
        <h1>鹿威し<br>カコーン</h1>
        <p class="tagline">鹿威しタイミングチャレンジ</p>
      </div>
      <div class="title-bottom">
        <p class="best-line">BEST SCORE <b id="best">0</b></p>
        <p id="title-name" class="title-name"></p>
        <button id="btn-start" class="btn primary big">START</button>
        <p class="howto">竹筒が戻って石に当たる瞬間にタップ</p>
      </div>
      <div class="corner">
        <button id="btn-sound" class="icon-btn" aria-label="サウンド切り替え">🔊</button>
        <button id="btn-settings" class="icon-btn" aria-label="設定">⚙</button>
      </div>
    </section>

    <!-- リザルト画面 -->
    <section id="result-screen" class="screen">
      <div class="panel">
        <h2>GAME OVER</h2>
        <p id="final-score" class="final-score">0</p>
        <p class="label center">YOUR SCORE</p>
        <p id="new-best" class="new-best" hidden>NEW BEST!</p>
        <dl class="stats">
          <div><dt>BEST</dt><dd id="r-best">0</dd></div>
          <div><dt>PERFECT</dt><dd id="r-perfect">0</dd></div>
          <div><dt>GREAT</dt><dd id="r-great">0</dd></div>
          <div><dt>MAX COMBO</dt><dd id="r-combo">0</dd></div>
        </dl>
        <p id="r-title" class="new-title" hidden></p>

        <button id="btn-retry" class="btn primary big">もう一度遊ぶ</button>
        <button id="btn-home" class="link-btn">HOME</button>
      </div>
    </section>

    <!-- 設定 -->
    <section id="settings-screen" class="screen">
      <div class="panel">
        <h3>設定</h3>
        <label class="row"><span>サウンド</span><input id="opt-sound" type="checkbox"></label>
        <label class="row"><span>振動</span><input id="opt-vibe" type="checkbox"></label>
        <h3>記録</h3>
        <dl id="records" class="records"></dl>
        <h3>称号</h3>
        <ul id="titles" class="titles"></ul>
        <button id="btn-settings-close" class="btn">閉じる</button>
        <button id="btn-reset" class="link-btn danger">記録をリセット</button>
      </div>
    </section>

  </div>
  <script type="module" src="src/main.js"></script>
</body>
</html>
